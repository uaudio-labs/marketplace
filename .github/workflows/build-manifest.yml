# Rebuilds manifest.json, which LUNA reads, from add_ons/ whenever main changes, and
# checks add_ons/ in every pull request (so the check can be required on main).
# Edit add_ons/, never manifest.json.
name: Build manifest

on:
  push:
    branches: [main]
    paths: ["add_ons/**", "scripts/build_manifest.py", "scripts/check_add_on.py"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-manifest-${{ github.ref }}

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I scripts/build_manifest.py --check add_ons

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      APP_ID: ${{ secrets.MARKETPLACE_APP_ID }}
    steps:
      # main only takes direct pushes from the org's GitHub App, so push with its token
      # when the repo has it.
      - name: Get a token from the App
        id: app
        if: env.APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.MARKETPLACE_APP_ID }}
          private-key: ${{ secrets.MARKETPLACE_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token || github.token }}
      - run: python3 -I scripts/build_manifest.py add_ons manifest.json
      - name: Commit manifest.json if it changed
        run: |
          if git diff --quiet -- manifest.json; then
              echo "manifest.json is up to date"
              exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build manifest.json from add_ons/" -- manifest.json
          git push origin HEAD:main
