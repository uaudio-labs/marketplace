# Checks an Add On submitted with the "Submit Add On" issue form and, when it passes,
# pushes submit/<owner>-<repo> adding add_ons/<owner>.<repo>.json and comments a link
# that opens its pull request for a maintainer (the uaudio-labs org does not let
# workflows create pull requests). Merging it lists the Add On (build-manifest.yml)
# and closes the issue.
#
# The publish job then does that itself with a short-lived token from the org's GitHub
# App, ua-marketplace-publisher (secrets PUBLISHER_APP_ID and PUBLISHER_APP_KEY): it
# opens the pull request, waits for its checks and merges it. Because the merge is
# made with the App's token rather than github.token, it triggers build-manifest.yml
# on main. A submission the content checks flagged (check_add_on.py's "review": possible
# profanity, other companies' marks, bundled recordings, confidential notices) gets its
# pull request but is not merged: it opens as a draft labelled needs-review for a
# maintainer, and the branch stays held while an open or declined pull request from it
# has the label, even if a later edit of the issue comes back clean.
# Only the publish job sees the App's key.
#
# The issue is untrusted input: the workflow runs only this repo's main branch, reads
# the issue from the event file (never through ${{ }} in a script), and the checker
# downloads and parses the release without running anything in it.
name: Submit Add On

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  pull-requests: read
  issues: write

concurrency:
  group: submit-add-on-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  submit:
    if: github.event.issue.state == 'open' && contains(github.event.issue.labels.*.name, 'add-on-submission')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      branch: ${{ steps.push.outputs.branch }}
      title: ${{ steps.push.outputs.title }}
      body: ${{ steps.push.outputs.body }}
      review: ${{ steps.push.outputs.review }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check the submission
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I scripts/check_add_on.py --event "$GITHUB_EVENT_PATH" --registry add_ons --json "$RUNNER_TEMP/result.json"

      - name: Push the branch, or say what is wrong
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          RESULT: ${{ runner.temp }}/result.json
        run: bash scripts/push_submission.sh

  publish:
    needs: submit
    if: needs.submit.outputs.branch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    steps:
      - name: Get a token for ua-marketplace-publisher
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PUBLISHER_APP_ID }}
          private-key: ${{ secrets.PUBLISHER_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Open the pull request, wait for its checks and merge it
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          BRANCH: ${{ needs.submit.outputs.branch }}
          TITLE: ${{ needs.submit.outputs.title }}
          BODY: ${{ needs.submit.outputs.body }}
          REVIEW: ${{ needs.submit.outputs.review }}
        run: |
          set -euo pipefail
          [[ "$BRANCH" =~ ^submit/[a-z0-9-]+-[a-z0-9._-]+$ ]] || { echo "unexpected branch '$BRANCH'" >&2; exit 1; }

          # Held for a maintainer when this run's checks flagged it, when a pull request
          # from the branch that is open or was declined (closed unmerged) carries the
          # label, or when either answer is missing: fail closed, never merge by default.
          # One a maintainer approved and merged doesn't hold later updates.
          labelled="$(gh pr list --head "$BRANCH" --state all --label needs-review --json state \
              --jq 'any(.[]; .state != "MERGED")')"
          hold=false
          [[ "$REVIEW" != "false" || "$labelled" != "false" ]] && hold=true

          pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr" ]]; then
              # A held one opens as a draft, which gh pr merge refuses, so it can't be
              # merged even if this run stops before labelling it.
              draft=()
              [[ "$hold" == "true" ]] && draft=(--draft)
              url="$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY" "${draft[@]}")"
              pr="${url##*/}"
          else
              gh api -X PATCH "repos/$GH_REPO/pulls/$pr" -f title="$TITLE" -f body="$BODY" >/dev/null
          fi
          echo "Pull request #$pr"

          if [[ "$hold" == "true" ]]; then
              gh label create needs-review --force --color D93F0B \
                  --description "Flagged by the content checks; a maintainer merges it by hand"
              gh api -X POST "repos/$GH_REPO/issues/$pr/labels" -f 'labels[]=needs-review' >/dev/null
              gh issue comment "$ISSUE" --body "#$pr is waiting for a maintainer's review before it is listed, so it was not merged automatically."
              exit 0
          fi

          # Checks take a moment to register on a new pull request or push.
          for _ in $(seq 1 24); do
              sleep 10
              gh pr checks "$pr" >/dev/null 2>&1 && break
              [[ $? -eq 8 ]] && break   # 8: checks registered, still pending
          done
          if ! gh pr checks "$pr" --watch --interval 15; then
              gh issue comment "$ISSUE" --body "The checks on #$pr failed, so it was not merged automatically. A maintainer will take a look."
              exit 1
          fi

          # A maintainer may have labelled it while its checks ran.
          if [[ "$(gh pr view "$pr" --json labels,isDraft --jq '.isDraft or any(.labels[]; .name == "needs-review")')" != "false" ]]; then
              echo "#$pr is held for review"
              exit 0
          fi
          gh pr merge "$pr" --merge
