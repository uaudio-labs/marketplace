name: Submit Add On
description: Ask for your LUNA Add On to be listed in the LUNA Add On Marketplace.
title: "Add On: "
labels: ["add-on-submission"]
body:
  - type: markdown
    attributes:
      value: |
        LUNA fills this in when you choose **Submit** in Settings > ADD ONS > MARKETPLACE.

        Your repository must be public, and its latest release (not a draft or pre-release) must have
        a `.lunaaddon` file attached. Once you create this issue, a check runs on that release and
        comments here. If it passes, a branch adding your repository is pushed for review, and
        the Add On appears in LUNA once Universal Audio merges it. To list a newer release of an
        Add On already in the marketplace, publish it and submit the repository again.
  - type: input
    id: add_on_repository
    attributes:
      label: GitHub repository
      description: The address of the repository whose releases carry your Add On.
      placeholder: https://github.com/owner/repository
    validations:
      required: true
  - type: input
    id: contact_email
    attributes:
      label: Contact e-mail
      description: Where Universal Audio can reach you about this Add On. Anyone can read this issue, so the address is public.
      placeholder: you@example.com
    validations:
      required: true
  - type: checkboxes
    id: rights
    attributes:
      label: Rights
      description: >-
        Universal Audio lists only Add Ons their builders are free to share. Submissions with
        recordings, MIDI, other companies' product names or confidential material are reviewed
        by hand, and a listed Add On can be taken down if its owner asks.
      options:
        - label: >-
            I made everything in this Add On (code, sounds, images, fonts and text), or have
            permission to share it, and it contains nothing confidential.
          required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes for the reviewer
      description: Anything Universal Audio should know (optional).
    validations:
      required: false
